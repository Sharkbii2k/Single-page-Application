<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Trung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        kaiti: ['Kaiti', 'STKaiti', 'BiauKai', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Flashcard Flip Animation */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-inner { transition: transform 0.6s; }
        
        /* Auto-scaling text for flashcard */
        .text-fluid-hanzi { font-size: clamp(3rem, 10vw, 8rem); line-height: 1.2; }
        .text-fluid-pinyin { font-size: clamp(1.5rem, 4vw, 3rem); }
        .text-fluid-meaning { font-size: clamp(1.2rem, 3vw, 2rem); }
        
        /* Layout Transition */
        #app-container { transition: max-width 0.3s ease; }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-200 min-h-screen">

<div id="app-container" class="max-w-6xl mx-auto p-4 flex flex-col h-screen">
    
    <!-- Header & Settings -->
    <div class="flex flex-wrap justify-between items-center mb-6 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
        <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400"><i class="fa-solid fa-language mr-2"></i>Hán Tự Master</h1>
        <div class="flex gap-3">
            <button onclick="toggleLayout()" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200" title="Chuyển PC/Mobile">
                <i id="layout-icon" class="fa-solid fa-mobile-screen"></i>
            </button>
            <button onclick="toggleTheme()" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200" title="Sáng/Tối">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-4 overflow-x-auto pb-2 shrink-0">
        <button onclick="switchTab('vocab')" id="btn-vocab" class="tab-btn px-4 py-2 bg-blue-500 text-white rounded-lg font-medium whitespace-nowrap"><i class="fa-solid fa-table-list mr-2"></i>Bảng Từ</button>
        <button onclick="switchTab('flashcard')" id="btn-flashcard" class="tab-btn px-4 py-2 bg-white dark:bg-gray-800 rounded-lg font-medium whitespace-nowrap hover:bg-blue-50 dark:hover:bg-gray-700"><i class="fa-regular fa-clone mr-2"></i>Flashcard</button>
        <button onclick="switchTab('typing')" id="btn-typing" class="tab-btn px-4 py-2 bg-white dark:bg-gray-800 rounded-lg font-medium whitespace-nowrap hover:bg-blue-50 dark:hover:bg-gray-700"><i class="fa-regular fa-keyboard mr-2"></i>Gõ Hán Tự</button>
        <button onclick="switchTab('import')" id="btn-import" class="tab-btn px-4 py-2 bg-white dark:bg-gray-800 rounded-lg font-medium whitespace-nowrap hover:bg-blue-50 dark:hover:bg-gray-700"><i class="fa-solid fa-file-import mr-2"></i>Nạp Tài Liệu</button>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-hidden flex flex-col bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 relative">
        
        <!-- TAB 1: BẢNG TỪ VỰNG -->
        <div id="tab-vocab" class="tab-content h-full flex flex-col">
            <div class="flex flex-wrap gap-4 mb-4">
                <input type="text" id="vocab-search" onkeyup="renderVocabTable()" placeholder="Tìm kiếm từ vựng..." class="flex-1 p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="vocab-level" onchange="renderVocabTable()" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                    <option value="all">Tất cả cấp độ</option>
                </select>
            </div>
            <div class="flex-1 overflow-auto rounded-lg border dark:border-gray-700">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 dark:bg-gray-700 sticky top-0">
                        <tr>
                            <th class="p-3 font-semibold w-1/4">Hán Tự</th>
                            <th class="p-3 font-semibold w-1/4">Pinyin</th>
                            <th class="p-3 font-semibold w-2/4">Nghĩa</th>
                        </tr>
                    </thead>
                    <tbody id="vocab-tbody" class="divide-y dark:divide-gray-700"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: FLASHCARD -->
        <div id="tab-flashcard" class="tab-content hidden h-full flex flex-col items-center">
            <div class="flex gap-4 mb-4 w-full justify-center">
                <select id="fc-level" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    <option value="all">Tất cả cấp độ</option>
                </select>
                <select id="fc-mode" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    <option value="random">Ngẫu nhiên</option>
                    <option value="sequential">Theo thứ tự</option>
                </select>
                <button onclick="startFlashcard()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"><i class="fa-solid fa-play mr-2"></i>Bắt đầu</button>
            </div>

            <div class="flex-1 w-full max-w-2xl flex flex-col justify-center items-center relative perspective-1000">
                <div id="flashcard-status" class="text-gray-500 dark:text-gray-400 mb-2 font-medium"></div>
                
                <div id="flashcard-container" onclick="flipCard()" class="w-full h-[60vh] relative transform-style-3d card-inner cursor-pointer hidden">
                    <!-- Mặt trước -->
                    <div class="absolute w-full h-full bg-blue-50 dark:bg-gray-700 border-2 border-blue-200 dark:border-gray-600 rounded-2xl shadow-lg flex items-center justify-center backface-hidden p-4">
                        <span id="fc-front-hanzi" class="font-kaiti text-fluid-hanzi text-gray-800 dark:text-gray-100"></span>
                    </div>
                    <!-- Mặt sau -->
                    <div class="absolute w-full h-full bg-green-50 dark:bg-gray-700 border-2 border-green-200 dark:border-gray-600 rounded-2xl shadow-lg flex flex-col items-center justify-center backface-hidden rotate-y-180 p-8 text-center">
                        <span id="fc-back-hanzi" class="font-kaiti text-fluid-hanzi text-gray-800 dark:text-gray-100 mb-4"></span>
                        <span id="fc-back-pinyin" class="text-fluid-pinyin text-blue-600 dark:text-blue-400 font-medium mb-2"></span>
                        <span id="fc-back-meaning" class="text-fluid-meaning text-gray-700 dark:text-gray-300"></span>
                    </div>
                </div>

                <div id="fc-controls" class="flex gap-4 mt-6 hidden">
                    <button onclick="markCard(false)" class="px-6 py-3 bg-red-500 text-white rounded-xl font-bold shadow hover:bg-red-600 transform transition hover:scale-105">
                        <i class="fa-solid fa-xmark mr-2"></i>Chưa nhớ
                    </button>
                    <button onclick="markCard(true)" class="px-6 py-3 bg-green-500 text-white rounded-xl font-bold shadow hover:bg-green-600 transform transition hover:scale-105">
                        <i class="fa-solid fa-check mr-2"></i>Đã nhớ
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 3: GÕ HÁN TỰ -->
        <div id="tab-typing" class="tab-content hidden h-full flex flex-col">
            <div class="flex flex-wrap gap-4 mb-4 justify-between items-center">
                <div class="flex gap-2">
                    <select id="type-level" onchange="renderTypingTable()" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="all">Tất cả cấp độ</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTypingVisibility('hanzi')" class="px-3 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 text-sm"><i class="fa-solid fa-eye-slash mr-2"></i>Ẩn/Hiện Hán Tự</button>
                    <button onclick="toggleTypingVisibility('pinyin')" class="px-3 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 text-sm"><i class="fa-solid fa-eye-slash mr-2"></i>Ẩn/Hiện Pinyin</button>
                </div>
            </div>
            <div class="flex-1 overflow-auto rounded-lg border dark:border-gray-700">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 dark:bg-gray-700 sticky top-0">
                        <tr>
                            <th class="p-3 font-semibold w-1/5">Hán Tự</th>
                            <th class="p-3 font-semibold w-1/5">Pinyin</th>
                            <th class="p-3 font-semibold w-1/4">Nghĩa</th>
                            <th class="p-3 font-semibold w-1/5">Kiểm Tra</th>
                            <th class="p-3 font-semibold w-[15%]">Kết Quả</th>
                        </tr>
                    </thead>
                    <tbody id="typing-tbody" class="divide-y dark:divide-gray-700"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 4: NẠP TÀI LIỆU -->
        <div id="tab-import" class="tab-content hidden h-full flex flex-col">
            <div class="mb-4 flex gap-4 items-center">
                <input type="text" id="import-level" placeholder="Nhập tên cấp độ (VD: HSK 1, HSK 2...)" class="w-1/3 p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                <button onclick="importData()" class="px-6 py-2 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600"><i class="fa-solid fa-save mr-2"></i>Lưu Dữ Liệu</button>
                <button onclick="clearData()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 ml-auto"><i class="fa-solid fa-trash mr-2"></i>Xóa toàn bộ</button>
            </div>
            <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg mb-2 text-sm text-blue-800 dark:text-blue-200">
                <strong>Hướng dẫn:</strong> Copy paste dữ liệu dạng bảng (Excel) hoặc văn bản. Mỗi dòng 1 từ, ngăn cách bởi dấu Tab (<code>Khoảng trắng lớn</code>), dấu <code>|</code> hoặc <code>-</code>.<br>
                <em>Cấu trúc: Hán Tự [ngăn cách] Pinyin [ngăn cách] Nghĩa</em>. (VD: 你好 | nǐ hǎo | Xin chào)
            </div>
            <textarea id="import-area" class="flex-1 w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 font-mono resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Dán dữ liệu vào đây..."></textarea>
        </div>

    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let vocabData = JSON.parse(localStorage.getItem('chinese_vocab_data')) || [];
    let isDarkMode = localStorage.getItem('theme') === 'dark';
    let isMobileLayout = localStorage.getItem('layout') === 'mobile';
    
    // Visibility toggles for Typing Tab
    let typingVisibility = { hanzi: true, pinyin: true };
    
    // Flashcard State
    let fcQueue = [];
    let currentFcIndex = 0;
    let isFlipped = false;

    // --- INITIALIZATION ---
    function init() {
        applyTheme();
        applyLayout();
        updateLevelSelects();
        renderVocabTable();
    }

    // --- UI/UX SETTINGS ---
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }
    
    function applyTheme() {
        if (isDarkMode) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-moon';
        }
    }

    function toggleLayout() {
        isMobileLayout = !isMobileLayout;
        localStorage.setItem('layout', isMobileLayout ? 'mobile' : 'pc');
        applyLayout();
    }

    function applyLayout() {
        const container = document.getElementById('app-container');
        if (isMobileLayout) {
            container.classList.replace('max-w-6xl', 'max-w-md');
            document.getElementById('layout-icon').className = 'fa-solid fa-desktop';
        } else {
            container.classList.replace('max-w-md', 'max-w-6xl');
            document.getElementById('layout-icon').className = 'fa-solid fa-mobile-screen';
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('bg-blue-500', 'text-white');
            el.classList.add('bg-white', 'dark:bg-gray-800');
        });
        
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        document.getElementById(`btn-${tabId}`).classList.remove('bg-white', 'dark:bg-gray-800');
        document.getElementById(`btn-${tabId}`).classList.add('bg-blue-500', 'text-white');

        if (tabId === 'vocab') renderVocabTable();
        if (tabId === 'typing') renderTypingTable();
    }

    function updateLevelSelects() {
        const levels = [...new Set(vocabData.map(d => d.level).filter(Boolean))];
        const selects = ['vocab-level', 'fc-level', 'type-level'];
        
        selects.forEach(id => {
            const el = document.getElementById(id);
            const val = el.value;
            el.innerHTML = '<option value="all">Tất cả cấp độ</option>';
            levels.forEach(lv => {
                el.innerHTML += `<option value="${lv}">${lv}</option>`;
            });
            if(levels.includes(val)) el.value = val;
        });
    }

    // --- TAB 1: BẢNG TỪ VỰNG ---
    function renderVocabTable() {
        const tbody = document.getElementById('vocab-tbody');
        const searchTerm = document.getElementById('vocab-search').value.toLowerCase();
        const level = document.getElementById('vocab-level').value;

        const filtered = vocabData.filter(item => {
            const matchLevel = level === 'all' || item.level === level;
            const matchSearch = item.hanzi.toLowerCase().includes(searchTerm) || 
                                item.pinyin.toLowerCase().includes(searchTerm) || 
                                item.meaning.toLowerCase().includes(searchTerm);
            return matchLevel && matchSearch;
        });

        tbody.innerHTML = filtered.map(item => `
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                <td class="p-3 font-kaiti text-xl">${item.hanzi}</td>
                <td class="p-3">${item.pinyin}</td>
                <td class="p-3">${item.meaning}
                    ${item.level ? `<span class="ml-2 text-xs bg-gray-200 dark:bg-gray-600 px-2 py-1 rounded">${item.level}</span>` : ''}
                </td>
            </tr>
        `).join('');
    }

    // --- TAB 2: FLASHCARD ---
    function startFlashcard() {
        const level = document.getElementById('fc-level').value;
        const mode = document.getElementById('fc-mode').value;
        
        let filtered = vocabData.filter(item => level === 'all' || item.level === level);
        
        if (filtered.length === 0) {
            alert("Không có từ vựng ở cấp độ này!");
            return;
        }

        fcQueue = JSON.parse(JSON.stringify(filtered)); // clone
        if (mode === 'random') {
            fcQueue.sort(() => Math.random() - 0.5);
        }

        document.getElementById('flashcard-container').classList.remove('hidden');
        document.getElementById('fc-controls').classList.add('hidden');
        showNextCard();
    }

    function showNextCard() {
        if (fcQueue.length === 0) {
            document.getElementById('flashcard-container').classList.add('hidden');
            document.getElementById('fc-controls').classList.add('hidden');
            document.getElementById('flashcard-status').innerText = "🎉 Chúc mừng! Bạn đã hoàn thành bộ flashcard này.";
            return;
        }

        isFlipped = false;
        document.getElementById('flashcard-container').classList.remove('rotate-y-180');
        document.getElementById('fc-controls').classList.add('hidden');
        document.getElementById('flashcard-status').innerText = `Còn lại: ${fcQueue.length} từ`;

        const card = fcQueue[0];
        document.getElementById('fc-front-hanzi').innerText = card.hanzi;
        document.getElementById('fc-back-hanzi').innerText = card.hanzi;
        document.getElementById('fc-back-pinyin').innerText = card.pinyin;
        document.getElementById('fc-back-meaning').innerText = card.meaning;
    }

    function flipCard() {
        if (!fcQueue.length) return;
        isFlipped = !isFlipped;
        const container = document.getElementById('flashcard-container');
        if (isFlipped) {
            container.classList.add('rotate-y-180');
            document.getElementById('fc-controls').classList.remove('hidden');
        } else {
            container.classList.remove('rotate-y-180');
            document.getElementById('fc-controls').classList.add('hidden');
        }
    }

    function markCard(remembered) {
        const card = fcQueue.shift(); // Remove from front
        if (!remembered) {
            fcQueue.push(card); // Move to back if forgotten
        }
        showNextCard();
    }

    // --- TAB 3: GÕ HÁN TỰ ---
    function renderTypingTable() {
        const tbody = document.getElementById('typing-tbody');
        const level = document.getElementById('type-level').value;

        const filtered = vocabData.filter(item => level === 'all' || item.level === level);

        tbody.innerHTML = filtered.map((item, index) => `
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                <td class="p-3 font-kaiti text-xl">
                    <span class="${typingVisibility.hanzi ? '' : 'blur-sm bg-gray-300 dark:bg-gray-600 text-transparent select-none'}">${item.hanzi}</span>
                    <button onclick="speak('${item.hanzi}')" class="ml-2 text-blue-500 hover:text-blue-700"><i class="fa-solid fa-volume-high"></i></button>
                </td>
                <td class="p-3 ${typingVisibility.pinyin ? '' : 'blur-sm bg-gray-300 dark:bg-gray-600 text-transparent select-none'}">${item.pinyin}</td>
                <td class="p-3">${item.meaning}</td>
                <td class="p-3">
                    <input type="text" data-hanzi="${item.hanzi}" oninput="checkTyping(this, 'res-${index}')" class="w-full p-2 border rounded font-kaiti text-xl dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                </td>
                <td class="p-3" id="res-${index}"></td>
            </tr>
        `).join('');
    }

    function toggleTypingVisibility(type) {
        typingVisibility[type] = !typingVisibility[type];
        renderTypingTable();
    }

    function checkTyping(inputObj, resId) {
        const expected = inputObj.getAttribute('data-hanzi');
        const resObj = document.getElementById(resId);
        if (!inputObj.value) {
            resObj.innerHTML = '';
            inputObj.classList.remove('border-green-500', 'border-red-500');
        } else if (inputObj.value === expected) {
            resObj.innerHTML = '<span class="text-green-500 font-bold"><i class="fa-solid fa-check"></i> Chính xác</span>';
            inputObj.classList.add('border-green-500');
            inputObj.classList.remove('border-red-500');
        } else {
            resObj.innerHTML = '<span class="text-red-500"><i class="fa-solid fa-xmark"></i> Sai</span>';
            inputObj.classList.add('border-red-500');
            inputObj.classList.remove('border-green-500');
        }
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'zh-CN';
            window.speechSynthesis.speak(msg);
        }
    }

    // --- TAB 4: NẠP DỮ LIỆU ---
    function importData() {
        const text = document.getElementById('import-area').value.trim();
        const level = document.getElementById('import-level').value.trim() || 'Chưa phân loại';
        
        if (!text) {
            alert("Vui lòng dán dữ liệu vào khung!");
            return;
        }

        const lines = text.split('\n');
        let addedCount = 0;

        lines.forEach(line => {
            // Tự động phân tách bằng Tab, dấu |, hoặc dấu -
            const parts = line.split(/\t|\||-/).map(p => p.trim()).filter(Boolean);
            if (parts.length >= 3) {
                vocabData.push({
                    id: Date.now() + Math.random().toString(36).substr(2, 9),
                    hanzi: parts[0],
                    pinyin: parts[1],
                    meaning: parts.slice(2).join(', '), // Gom các phần còn lại làm nghĩa
                    level: level
                });
                addedCount++;
            }
        });

        if (addedCount > 0) {
            localStorage.setItem('chinese_vocab_data', JSON.stringify(vocabData));
            document.getElementById('import-area').value = '';
            updateLevelSelects();
            alert(`Đã thêm thành công ${addedCount} từ vựng!`);
        } else {
            alert("Không tìm thấy cấu trúc hợp lệ (Hán Tự | Pinyin | Nghĩa) trên các dòng!");
        }
    }

    function clearData() {
        if(confirm("Bạn có chắc chắn muốn XÓA TOÀN BỘ dữ liệu từ vựng không? Hành động này không thể hoàn tác!")) {
            vocabData = [];
            localStorage.setItem('chinese_vocab_data', JSON.stringify(vocabData));
            updateLevelSelects();
            renderVocabTable();
            alert("Đã xóa toàn bộ dữ liệu.");
        }
    }

    // Run init on load
    window.onload = init;
</script>
</body>
</html>
